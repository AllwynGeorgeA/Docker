services:

  frontend:
    build: ./frontend
    container_name: genai-frontend

    ports:
      - "8501:8501"

    environment:
      BACKEND_URL: http://backend:8000

    depends_on:
      - backend


  backend:
    build: ./backend
    container_name: genai-backend

    ports:
      - "8000:8000"

    env_file:
      - .env


  nginx:
    image: nginx:alpine
    container_name: genai-nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - backend